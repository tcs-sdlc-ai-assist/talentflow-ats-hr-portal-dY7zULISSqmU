{% extends "base.html" %}

{% block title %}Login — TalentFlow ATS{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="text-center">
            <span class="text-5xl" aria-hidden="true">🎯</span>
            <h1 class="mt-4 text-2xl font-bold leading-9 tracking-tight text-gray-900">
                Sign in to TalentFlow
            </h1>
            <p class="mt-2 text-sm text-gray-600">
                Enter your credentials to access the applicant tracking system
            </p>
        </div>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white px-6 py-8 shadow-lg sm:rounded-lg sm:px-12 border border-gray-200">
            {% if error %}
            <div class="mb-6 rounded-md bg-red-50 p-4 border border-red-200" role="alert">
                <div class="flex items-center">
                    <svg class="h-5 w-5 text-red-400 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                    </svg>
                    <p class="ml-3 text-sm font-medium text-red-800">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form class="space-y-6" action="/auth/login" method="POST">
                <div>
                    <label for="username" class="block text-sm font-medium leading-6 text-gray-900">
                        Username
                    </label>
                    <div class="mt-2">
                        <input id="username" name="username" type="text" autocomplete="username" required
                            class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                            placeholder="Enter your username"
                            {% if username %}value="{{ username }}"{% endif %}>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium leading-6 text-gray-900">
                        Password
                    </label>
                    <div class="mt-2">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                            placeholder="Enter your password">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-colors">
                        Sign in
                    </button>
                </div>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-gray-500">
            Don't have an account?
            <a href="/auth/register" class="font-semibold leading-6 text-indigo-600 hover:text-indigo-500 transition-colors">
                Register here
            </a>
        </p>
    </div>
</div>
{% endblock %}
